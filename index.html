<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VOSC Activity 1 - Tic-Tac-Toe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <header>
      <p class="activity">VOSC Activity 1</p>
      <h1>Tic-Tac-Toe</h1>
    </header>

    <!-- Shows whose turn it is, or the result -->
    <p id="status" class="status" aria-live="polite">Player X's turn</p>

    <!-- 3x3 board: 9 buttons, so they work with keyboard (Tab + Enter) -->
    <section id="board" class="board" aria-label="Tic-Tac-Toe board">
      <button class="cell" data-index="0" aria-label="Row 1, column 1, empty"></button>
      <button class="cell" data-index="1" aria-label="Row 1, column 2, empty"></button>
      <button class="cell" data-index="2" aria-label="Row 1, column 3, empty"></button>
      <button class="cell" data-index="3" aria-label="Row 2, column 1, empty"></button>
      <button class="cell" data-index="4" aria-label="Row 2, column 2, empty"></button>
      <button class="cell" data-index="5" aria-label="Row 2, column 3, empty"></button>
      <button class="cell" data-index="6" aria-label="Row 3, column 1, empty"></button>
      <button class="cell" data-index="7" aria-label="Row 3, column 2, empty"></button>
      <button class="cell" data-index="8" aria-label="Row 3, column 3, empty"></button>
    </section>

    <button id="restart" class="restart" aria-label="Restart the game">Restart Game</button>

    <footer>Built with HTML, CSS &amp; JavaScript</footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
